<style>
  /* Center all reader elements on the page */
.reader-wrapper {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
}

  /* Prevents users from highlighting or selecting text/images */
  .unselectable {
    -webkit-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;
    user-select: none;
  }

  .reader-container {
    position: relative;
    display: inline-block;
    max-width: 800px;
    border: 1px solid var(--neon-violet);
    margin-top: 15px;
  }

  /* Animated border glow for active reading */
  .reader-container.tts-active {
    border-color: var(--neon-cyan);
    box-shadow: 0 0 12px rgba(0, 232, 255, 0.5);
    animation: borderPulse 2s infinite ease-in-out;
    transition: all 0.3s ease;
  }

  @keyframes borderPulse {
    0% { box-shadow: 0 0 12px rgba(0, 232, 255, 0.4); }
    50% { box-shadow: 0 0 18px rgba(0, 232, 255, 0.8); }
    100% { box-shadow: 0 0 12px rgba(0, 232, 255, 0.4); }
  }

  /* The Invisible Shield */
  .shield {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 10;
    background: rgba(255, 255, 255, 0); /* Completely transparent */
  }
  
  .page {
    display: none;
    opacity: 0;
    transition: opacity 0.5s ease-in-out;
  }

  .page.active {
    display: block;
    opacity: 1;
  }

/* Nav Controls Panel - Matching TTS Controls */
.nav-controls {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 15px;
  margin-top: 10px;
  /* Semi-transparent dark purple - matching tts-controls */
  background: var(--bg-card);
  border-radius: 6px;
  /* Accent border like tts-controls */
  border: 1px solid var(--neon-violet);
  max-width: 800px;
  z-index: 20;
  position: relative;
  color: var(--text-primary);
}

/* Navigation Buttons */
.nav-controls button {
  padding: 8px 15px;
  cursor: pointer;
  background-color: var(--neon-violet);
  color: var(--text-heading);
  border: none;
  border-radius: 4px;
  font-weight: bold;
}

.nav-controls button:disabled {
  background-color: var(--neon-magenta);
  cursor: not-allowed;
  opacity: 0.5;
}

/* Page Counter Text */
.nav-controls #pageCounter {
  font-weight: bold;
  color: var(--text-primary);
}

  /* Isolated button overrides to prevent breaking site-wide styles */
  .reader-container button,
  .tts-controls button {
    padding: 8px 15px;
    cursor: pointer;
    background-color: var(--neon-violet);
    color: var(--text-heading);
    border: none;
    border-radius: 4px;
  }

  .reader-container button:disabled, 
  .tts-controls button:disabled {
    background-color: var(--neon-magenta);
    cursor: not-allowed;
    opacity: 0.5;
  }

/* Restored & Responsive TTS Controls Panel Styling */
.tts-controls {
  display: flex;
  align-items: center;
  justify-content: space-between; /* Distributes items nicely */
  flex-wrap: wrap;               /* CRITICAL: Allows items to wrap on mobile */
  gap: 12px;

<script>
let currentPage = 0;
const pages = document.querySelectorAll('.page');
const pageCounter = document.getElementById('pageCounter');

// TTS state tracking
let synth = window.speechSynthesis;
let utterance = null;
let isPaused = false;
let voices = [];

// --- Voice persistence helpers ---
function saveVoice(voice) {
  if (!voice) return;
  const data = {
    name: voice.name,
    lang: voice.lang,
    voiceURI: voice.voiceURI
  };
  try {
    localStorage.setItem('preferredVoice', JSON.stringify(data));
  } catch (e) {}
}

function loadVoice() {
  try {
    const raw = localStorage.getItem('preferredVoice');
    if (!raw) return null;
    return JSON.parse(raw);
  } catch { return null; }
}

function applyStoredVoice() {
  const stored = loadVoice();
  if (!stored) return false;
  const select = document.getElementById('voiceSelect');
  let foundIndex = -1;
  for (let i = 0; i < voices.length; i++) {
    const v = voices[i];
    if (v.voiceURI === stored.voiceURI) {
      foundIndex = i;
      break;
    }
    if (v.name === stored.name && v.lang === stored.lang) {
      foundIndex = i;
      break;
    }
  }
  if (foundIndex > -1) {
    select.value = foundIndex;
    return true;
  }
  return false;
}

// --- Existing pagination functions ---
function showPage(index) {
  if (index < 0 || index >= pages.length) return;
  pages.forEach(page => page.classList.remove('active'));
  pages[index].classList.add('active');
  pageCounter.innerText = `Page ${index + 1} of ${pages.length}`;
  document.getElementById('prevBtn').disabled = (index === 0);
  document.getElementById('nextBtn').disabled = (index === pages.length - 1);
  if (synth && synth.speaking) {
    stopTTS();
  }
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function changePage(step) {
  currentPage += step;
  showPage(currentPage);
}

// --- TTS engine functions (updated with voice memory) ---
function populateVoiceList() {
  if (!synth) return;
  voices = synth.getVoices();
  const voiceSelect = document.getElementById('voiceSelect');
  voiceSelect.innerHTML = '';
  voices.forEach((voice, i) => {
    const option = document.createElement('option');
    option.textContent = `${voice.name} (${voice.lang})`;
    option.value = i;
    if (voice.default) option.selected = true;
    voiceSelect.appendChild(option);
  });
  // Restore saved voice
  applyStoredVoice();
}

if (synth && synth.onvoiceschanged !== undefined) {
  synth.onvoiceschanged = populateVoiceList;
}

function toggleTTS() {
  if (!synth) return;
  const readerBox = document.querySelector('.reader-container');
  if (synth.speaking && !isPaused) {
    synth.pause();
    isPaused = true;
    document.getElementById('ttsPlayBtn').innerText = '⏸️ Resume';
    if (readerBox) readerBox.classList.remove('tts-active');
    return;
  }
  if (isPaused) {
    synth.resume();
    isPaused = false;
    document.getElementById('ttsPlayBtn').innerText = '⏸️ Pause';
    if (readerBox) readerBox.classList.add('tts-active');
    return;
  }

  let textToRead = 'No readable content found.';
  if (obscuredPages[currentPage]) {
    try {
      textToRead = atob(obscuredPages[currentPage]);
    } catch (e) {
      console.error('Error decoding page text.', e);
    }
  }

  utterance = new SpeechSynthesisUtterance(textToRead);
  const selectedVoiceIndex = document.getElementById('voiceSelect').value;
  if (voices[selectedVoiceIndex]) {
    utterance.voice = voices[selectedVoiceIndex];
  }

  utterance.onstart = function() {
    if (readerBox) readerBox.classList.add('tts-active');
  };

  utterance.onend = function() {
    if (currentPage < pages.length - 1) {
      currentPage++;
      showPage(currentPage);
      setTimeout(() => {
        toggleTTS();
      }, 300);
    } else {
      stopTTS();
    }
  };

  document.getElementById('ttsPlayBtn').innerText = '⏸️ Pause';
  document.getElementById('ttsStopBtn').disabled = false;
  synth.speak(utterance);
}

function stopTTS() {
  if (!synth) return;
  synth.cancel();
  isPaused = false;
  document.getElementById('ttsPlayBtn').innerText = '▶️ Play Audio';
  document.getElementById('ttsStopBtn').disabled = true;
  const readerBox = document.querySelector('.reader-container');
  if (readerBox) readerBox.classList.remove('tts-active');
}

function changeVoice() {
  const select = document.getElementById('voiceSelect');
  const idx = select.value;
  if (voices[idx]) saveVoice(voices[idx]);
  if (synth.speaking) {
    stopTTS();
    toggleTTS();
  }
}

// Initialisation
populateVoiceList();
showPage(0);
</script>
