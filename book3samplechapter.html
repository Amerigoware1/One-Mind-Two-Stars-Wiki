<style>
  /* Center all reader elements on the page */
.reader-wrapper {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
}

  /* Prevents users from highlighting or selecting text/images */
  .unselectable {
    -webkit-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;
    user-select: none;
  }

  .reader-container {
    position: relative;
    display: inline-block;
    max-width: 800px;
    border: 1px solid var(--neon-violet);
    margin-top: 15px;
  }

  /* Animated border glow for active reading */
  .reader-container.tts-active {
    border-color: var(--neon-cyan);
    box-shadow: 0 0 12px rgba(0, 232, 255, 0.5);
    animation: borderPulse 2s infinite ease-in-out;
    transition: all 0.3s ease;
  }

  @keyframes borderPulse {
    0% { box-shadow: 0 0 12px rgba(0, 232, 255, 0.4); }
    50% { box-shadow: 0 0 18px rgba(0, 232, 255, 0.8); }
    100% { box-shadow: 0 0 12px rgba(0, 232, 255, 0.4); }
  }

  /* The Invisible Shield */
  .shield {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 10;
    background: rgba(255, 255, 255, 0); /* Completely transparent */
  }
  
  .page {
    display: none;
    opacity: 0;
    transition: opacity 0.5s ease-in-out;
  }

  .page.active {
    display: block;
    opacity: 1;
  }

/* Nav Controls Panel - Matching TTS Controls */
.nav-controls {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 15px;
  margin-top: 10px;
  /* Semi-transparent dark purple - matching tts-controls */
  background: var(--bg-card);
  border-radius: 6px;
  /* Accent border like tts-controls */
  border: 1px solid var(--neon-violet);
  max-width: 800px;
  z-index: 20;
  position: relative;
  color: var(--text-primary);
}

/* Navigation Buttons */
.nav-controls button {
  padding: 8px 15px;
  cursor: pointer;
  background-color: var(--neon-violet);
  color: var(--text-heading);
  border: none;
  border-radius: 4px;
  font-weight: bold;
}

.nav-controls button:disabled {
  background-color: var(--neon-magenta);
  cursor: not-allowed;
  opacity: 0.5;
}

/* Page Counter Text */
.nav-controls #pageCounter {
  font-weight: bold;
  color: var(--text-primary);
}

  /* Isolated button overrides to prevent breaking site-wide styles */
  .reader-container button,
  .tts-controls button {
    padding: 8px 15px;
    cursor: pointer;
    background-color: var(--neon-violet);
    color: var(--text-heading);
    border: none;
    border-radius: 4px;
  }

  .reader-container button:disabled, 
  .tts-controls button:disabled {
    background-color: var(--neon-magenta);
    cursor: not-allowed;
    opacity: 0.5;
  }

  /* Restored TTS Controls Panel Styling */
.tts-controls {
  display: flex;
  align-items: center;
  gap: 12px;
  /* Semi-transparent dark purple */
  background: var(--bg-card); 
  padding: 10px 15px;
  border-radius: 6px;
  /* Bright accent border to make it pop */
  border: 1px solid var(--neon-violet); 
  max-width: 800px;
  margin-bottom: 10px;
  color: var(--text-primary);
}

  .tts-controls label {
    font-size: 0.9em;
    font-weight: bold;
    color: var(--text-muted);
  }

  .tts-controls select {
    padding: 5px;
    border-radius: 4px;
    border: 1px solid var(--neon-violet);
    background: var(--bg-card);
    color: var(--text-primary);
  }
</style>

<h1>Book 1, Chapter 1 Sample</h1>
<div class="reader-wrapper">
<div class="tts-controls">
  <button id="ttsPlayBtn" onclick="toggleTTS()">▶️ Play Audio</button>
  <button id="ttsStopBtn" onclick="stopTTS()" disabled>⏹️ Stop</button>
  <label for="voiceSelect">Voice:</label>
  <select id="voiceSelect" onchange="changeVoice()"></select>
</div>

<div class="reader-container unselectable" oncontextmenu="return false;">
  <div class="shield"></div>

  <div id="page-viewer">
    <div class="card-bg page"><img src="assets/samples/book3/chapter1-page1.jpg" loading="lazy" style="width:100%; display:block;" alt="Page 1" draggable="false"></div>
    <div class="card-bg page"><img src="assets/samples/book3/chapter1-page2.jpg" loading="lazy" style="width:100%; display:block;" alt="Page 2" draggable="false"></div>
    <div class="card-bg page"><img src="assets/samples/book3/chapter1-page3.jpg" loading="lazy" style="width:100%; display:block;" alt="Page 3" draggable="false"></div>
    <div class="card-bg page"><img src="assets/samples/book3/chapter1-page4.jpg" loading="lazy" style="width:100%; display:block;" alt="Page 4" draggable="false"></div>
    <div class="card-bg page"><img src="assets/samples/book3/chapter1-page5.jpg" loading="lazy" style="width:100%; display:block;" alt="Page 5" draggable="false"></div>
    <div class="card-bg page"><img src="assets/samples/book3/chapter1-page6.jpg" loading="lazy" style="width:100%; display:block;" alt="Page 6" draggable="false"></div>
    <div class="card-bg page"><img src="assets/samples/book3/chapter1-page7.jpg" loading="lazy" style="width:100%; display:block;" alt="Page 7" draggable="false"></div>
    <div class="card-bg page"><img src="assets/samples/book3/chapter1-page8.jpg" loading="lazy" style="width:100%; display:block;" alt="Page 8" draggable="false"></div>
  </div>

 <div class="nav-controls" style="margin-top: 10px; z-index: 20; position: relative;">
    <button onclick="changePage(-1)" id="prevBtn">⬅️ Previous</button>
    <span id="pageCounter">Page 1 of 8</span>
    <button onclick="changePage(1)" id="nextBtn">Next ➡️</button>
  </div>
</div>
</div>
<script>
let currentPage = 0;
const pages = document.querySelectorAll('.page');
const pageCounter = document.getElementById('pageCounter');

// TTS state tracking
let synth = window.speechSynthesis;
let utterance = null;
let isPaused = false;
let voices = [];

// --- Obscured Story Text Array ---
// Replace these placeholder strings with your actual Base64-encoded chapter text for each page
const obscuredPages = [
  "Use Base64 encoding to store the text content of each page here. For example, if you have the text for page 1, encode it using Base64 and place the resulting string in this array at index 0. Repeat this process for all pages, ensuring that the order of the text matches the order of the page images. This way, when a user clicks 'Play Audio,' the TTS engine can decode the corresponding text and read it aloud while displaying the correct page."
];

function showPage(index) {
  if (index < 0 || index >= pages.length) return;

  pages.forEach(page => page.classList.remove('active'));
  pages[index].classList.add('active');
  pageCounter.innerText = `Page ${index + 1} of ${pages.length}`;

  document.getElementById('prevBtn').disabled = (index === 0);
  document.getElementById('nextBtn').disabled = (index === pages.length - 1);

  if (synth && synth.speaking) {
    stopTTS();
  }

  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function changePage(step) {
  currentPage += step;
  showPage(currentPage);
}

// --- Text To Speech Engine Functions ---

function populateVoiceList() {
  if (!synth) return;
  voices = synth.getVoices();
  const voiceSelect = document.getElementById('voiceSelect');
  voiceSelect.innerHTML = '';
  
  voices.forEach((voice, i) => {
    const option = document.createElement('option');
    option.textContent = `${voice.name} (${voice.lang})`;
    option.value = i;
    if (voice.default) option.selected = true;
    voiceSelect.appendChild(option);
  });
}

if (synth && synth.onvoiceschanged !== undefined) {
  synth.onvoiceschanged = populateVoiceList;
}

function toggleTTS() {
  if (!synth) return;
  
  const readerBox = document.querySelector('.reader-container');

  if (synth.speaking && !isPaused) {
    synth.pause();
    isPaused = true;
    document.getElementById('ttsPlayBtn').innerText = "⏸️ Resume";
    if (readerBox) readerBox.classList.remove('tts-active'); // Pause the pulse
    return;
  }
  
  if (isPaused) {
    synth.resume();
    isPaused = false;
    document.getElementById('ttsPlayBtn').innerText = "⏸️ Pause";
    if (readerBox) readerBox.classList.add('tts-active'); // Resume the pulse
    return;
  }

  let textToRead = "No readable content found.";
  if (obscuredPages[currentPage]) {
    try {
      textToRead = atob(obscuredPages[currentPage]);
    } catch (e) {
      console.error("Error decoding page text.", e);
    }
  }

  utterance = new SpeechSynthesisUtterance(textToRead);
  const selectedVoiceIndex = document.getElementById('voiceSelect').value;
  if (voices[selectedVoiceIndex]) {
    utterance.voice = voices[selectedVoiceIndex];
  }

  // Handle active class tracking when audio starts
  utterance.onstart = function() {
    if (readerBox) readerBox.classList.add('tts-active');
  };

  utterance.onend = function() {
    if (currentPage < pages.length - 1) {
      currentPage++;
      showPage(currentPage);
      setTimeout(() => {
        toggleTTS(); 
      }, 300);
    } else {
      stopTTS();
    }
  };

  document.getElementById('ttsPlayBtn').innerText = "⏸️ Pause";
  document.getElementById('ttsStopBtn').disabled = false;
  
  synth.speak(utterance);
}

function stopTTS() {
  if (!synth) return;
  synth.cancel();
  isPaused = false;
  document.getElementById('ttsPlayBtn').innerText = "▶️ Play Audio";
  document.getElementById('ttsStopBtn').disabled = true;
  
  // Strip the active styling completely on stop
  const readerBox = document.querySelector('.reader-container');
  if (readerBox) readerBox.classList.remove('tts-active');
}

function changeVoice() {
  if (synth.speaking) {
    stopTTS();
    toggleTTS();
  }
}

populateVoiceList();
showPage(0);
</script>
