<!DOCTYPE html>
<html lang="{{ site.lang | default: "en" }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} - {% endif %}{{ site.title }}</title>
  <link rel="stylesheet" href="{{ "/WikiStyle.css" | relative_url }}">
  <link rel="icon" type="image/png" href="{{ site.baseurl }}/assets/images/favicon.png">
</head>
<body>

  {% include header.html %}

  <main class="page-content">
    <div class="wrapper">
      {{ content }}
    </div>
  </main>

  <footer class="site-footer">
    <div class="wrapper">
      <p>&copy; {{ "now" | date: "%Y" }} {{ site.title }}</p>
    </div>
  </footer>

  <!- Load TTS script – using baseurl to ensure correct path ->
  <script src="{{ site.baseurl }}/tts.js"></script>
</body>
</html>
