
<svg viewBox="0 0 1040 780" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;">
  <rect width="1040" height="780" fill="#fbfaf7"/>

  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="10" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#6b6b6b"/>
    </marker>
  </defs>

  <!-- ══════════ TITLE ══════════ -->
  <text x="80" y="38" font-size="17" font-weight="700" fill="#1f1f1f">Auto-Otto — final cross-section, end view</text>
  <text x="80" y="58" font-size="12.5" fill="#7a7a7a">True scale · 1 cm = 8 px · 60 cm deep × 42 cm tall</text>

  <!-- ══════════ ORIENTATION ══════════ -->
  <text x="120" y="172" font-size="12" fill="#7a7a7a">← far side</text>
  <text x="662" y="172" font-size="12" fill="#7a7a7a" text-anchor="end">sofa side</text>

  <!-- ══════════ GROUND ══════════ -->
  <line x1="140" y1="540" x2="690" y2="540" stroke="#c2bcb1" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- ══════════ BODY ══════════ -->
  <path d="M 204,204
           L 378.4,204
           A 32,32 0 0 1 391.9,207
           L 636.9,321.2
           A 40,40 0 0 1 660,357.45
           L 660,528
           A 12,12 0 0 1 648,540
           L 192,540
           A 12,12 0 0 1 180,528
           L 180,228
           A 24,24 0 0 1 204,204 Z"
        fill="#e9e4db" stroke="#2b2b2b" stroke-width="2" stroke-linejoin="round"/>

  <!-- ══════════ FOOT / DEVICE SURFACE (purple) ══════════ -->
  <path d="M 204,204 L 378.4,204 A 32,32 0 0 1 391.9,207 L 636.9,321.2 A 40,40 0 0 1 660,357.45"
        fill="none" stroke="#8b3fa8" stroke-width="5" stroke-linecap="round"/>

  <!-- ══════════ RADII (maroon arcs) ══════════ -->
  <g fill="none" stroke="#8b1a3a" stroke-width="4.5" stroke-linecap="round">
    <path d="M 378.4,204 A 32,32 0 0 1 391.9,207"/>
    <path d="M 636.9,321.2 A 40,40 0 0 1 660,357.45"/>
    <path d="M 660,528 A 12,12 0 0 1 648,540"/>
    <path d="M 192,540 A 12,12 0 0 1 180,528"/>
    <path d="M 180,228 A 24,24 0 0 1 204,204"/>
  </g>

  <!-- ══════════ TOP COIL ZONE ══════════ -->
  <line x1="227" y1="213" x2="355" y2="213" stroke="#c8791a" stroke-width="8" stroke-linecap="round"/>
  <text x="291" y="240" font-size="12" fill="#c8791a" font-weight="600" text-anchor="middle">coil zone · 16 cm</text>

  <!-- ══════════ DRAWER ══════════ -->
  <rect x="212" y="418" width="436" height="110" rx="6"
        fill="#2f7fa8" fill-opacity="0.05"
        stroke="#2f7fa8" stroke-width="1.6" stroke-dasharray="7 5"/>
  <line x1="648" y1="420" x2="648" y2="526" stroke="#2f7fa8" stroke-width="6" stroke-linecap="round"/>
  <text x="424" y="452" font-size="13" fill="#2f7fa8" font-weight="600" text-anchor="middle">device drawer</text>
  <line x1="330" y1="486" x2="530" y2="486" stroke="#c8791a" stroke-width="7" stroke-linecap="round"/>
  <text x="430" y="508" font-size="11" fill="#c8791a" font-weight="600" text-anchor="middle">coil zone · 15 W</text>

  <!-- ══════════ ANGLE ══════════ -->
  <line x1="580" y1="332" x2="660" y2="332" stroke="#a8a8a8" stroke-width="1" stroke-dasharray="3 3"/>
  <path d="M 620,332 A 40,40 0 0 1 623.7,315.1" fill="none" stroke="#6b6b6b" stroke-width="1.2"/>
  <line x1="603" y1="294" x2="617" y2="315" stroke="#a8a8a8" stroke-width="1"/>
  <text x="598" y="288" font-size="12.5" fill="#4a4a4a" text-anchor="middle">25°</text>

  <!-- ══════════ DIMENSIONS ══════════ -->
  <line x1="180" y1="204" x2="118" y2="204" stroke="#a8a8a8" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="180" y1="540" x2="118" y2="540" stroke="#a8a8a8" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="126" y1="204" x2="126" y2="540" stroke="#6b6b6b" stroke-width="1.2"
        marker-start="url(#arw)" marker-end="url(#arw)"/>
  <text x="114" y="372" font-size="12.5" fill="#4a4a4a" text-anchor="middle"
        transform="rotate(-90 114 372)">42 cm</text>

  <line x1="180" y1="540" x2="180" y2="600" stroke="#a8a8a8" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="660" y1="540" x2="660" y2="600" stroke="#a8a8a8" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="180" y1="590" x2="660" y2="590" stroke="#6b6b6b" stroke-width="1.2"
        marker-start="url(#arw)" marker-end="url(#arw)"/>
  <text x="420" y="582" font-size="12.5" fill="#4a4a4a" text-anchor="middle">60 cm</text>

  <line x1="388" y1="540" x2="388" y2="632" stroke="#a8a8a8" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="180" y1="622" x2="388" y2="622" stroke="#6b6b6b" stroke-width="1.2"
        marker-start="url(#arw)" marker-end="url(#arw)"/>
  <text x="284" y="642" font-size="11.5" fill="#4a4a4a" text-anchor="middle">26 cm flat</text>
  <line x1="388" y1="622" x2="660" y2="622" stroke="#6b6b6b" stroke-width="1.2"
        marker-start="url(#arw)" marker-end="url(#arw)"/>
  <text x="524" y="642" font-size="11.5" fill="#4a4a4a" text-anchor="middle">34 cm ramp</text>

  <!-- ══════════ RIGHT PANEL ══════════ -->
  <g font-size="12.5">
    <text x="720" y="200" font-size="12.5" font-weight="700" fill="#8b1a3a">RADII — maroon arcs</text>
    <text x="720" y="222" fill="#4a4a4a">crest — 4 cm</text>
    <text x="720" y="240" fill="#4a4a4a">ramp → front face — 5 cm</text>
    <text x="720" y="258" fill="#4a4a4a">front face → floor — 1.5 cm</text>
    <text x="720" y="276" fill="#4a4a4a">back face → floor — 1.5 cm</text>
    <text x="720" y="294" fill="#4a4a4a">back face → flat top — 3 cm</text>

    <text x="720" y="330" font-size="12.5" font-weight="700" fill="#c8791a">COIL ZONES — amber</text>
    <text x="720" y="352" fill="#4a4a4a">flat top — 16 cm, 8 cm clear of crest</text>
    <text x="720" y="370" fill="#4a4a4a">drawer — 15 W, FOD live</text>

    <text x="720" y="406" font-size="12.5" font-weight="700" fill="#2f7fa8">DRAWER — blue</text>
    <text x="720" y="428" fill="#4a4a4a">flush smoked-translucent front panel</text>
    <text x="720" y="446" fill="#4a4a4a">charge glow reads through it</text>
    <text x="720" y="464" fill="#4a4a4a">opens on the far face</text>
    <text x="720" y="482" fill="#4a4a4a">invisible from the sofa</text>

    <text x="720" y="518" font-size="12.5" font-weight="700" fill="#4a4a4a">ORIENTATION</text>
    <text x="720" y="540" fill="#4a4a4a">flat top faces away from the sofa</text>
    <text x="720" y="558" fill="#4a4a4a">ramp descends toward sofa —</text>
    </g>

  <!-- ══════════ FOOTNOTE ══════════ -->
  <text x="80" y="700" font-size="11.5" fill="#8b3fa8">Purple = the surface a foot or a device touches. Continuous from the crest to the front face, no internal edges.</text>
  <text x="80" y="720" font-size="11.5" fill="#8b1a3a">Maroon = every rounded edge on the object. Nothing a shin, ankle, or heel crosses is left sharp.</text>
  <text x="80" y="740" font-size="11.5" fill="#2f7fa8">Blue = the drawer cavity, hidden inside. Only its translucent front panel is visible, and only from the near side.</text>
</svg>