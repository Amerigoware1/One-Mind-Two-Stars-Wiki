<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 6400 4800" width="200%" height="200%" style="background-color: #0d131d; font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Grid Pattern Scaled x4 -->
    <pattern id="grid" width="160" height="160" patternUnits="userSpaceOnUse">
      <path d="M 160 0 L 0 0 0 160" fill="none" stroke="#1e293b" stroke-width="4"/>
    </pattern>
    <pattern id="subgrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#151d2a" stroke-width="2"/>
    </pattern>

    <!-- UI/Tech Styles Scaled x4 -->
    <style>
      .title { font-size: 96px; font-weight: 700; fill: #f8fafc; letter-spacing: 8px; }
      .subtitle { font-size: 52px; font-weight: 600; fill: #38bdf8; letter-spacing: 16px; }
      .section-head { font-size: 64px; font-weight: 700; fill: #38bdf8; letter-spacing: 6px; }
      .label-title { font-size: 52px; font-weight: 700; fill: #f1f5f9; }
      .label-sub { font-size: 44px; fill: #94a3b8; }
      .dim-text { font-size: 44px; fill: #38bdf8; font-family: monospace; }
      .data-key { font-size: 48px; font-weight: 600; fill: #94a3b8; }
      .data-val { font-size: 48px; font-weight: 500; fill: #f8fafc; }
      .border-line { stroke: #334155; stroke-width: 6; }
      .accent-line { stroke: #0284c7; stroke-dasharray: 16,16; }
      .center-line { stroke: #e0f2fe; stroke-opacity: 0.3; stroke-dasharray: 24,24; }
      .hull-outer { fill: #1e293b; stroke: #475569; stroke-width: 8; }
      .hull-shield { fill: #0f172a; stroke: #334155; stroke-width: 6; }
      .deck-fill { fill: #1e293b; fill-opacity: 0.8; stroke: #38bdf8; stroke-width: 4; }
      .core-fill { fill: #0284c7; fill-opacity: 0.3; stroke: #38bdf8; stroke-width: 8; }
      .window-glow { fill: #0ea5e9; fill-opacity: 0.6; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#090d14"/>
  <rect width="100%" height="100%" fill="url(#subgrid)"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <!-- Outer Blueprint Frame -->
  <rect x="80" y="80" width="6240" height="4640" fill="none" stroke="#334155" stroke-width="8"/>
  <rect x="112" y="112" width="6176" height="4576" fill="none" stroke="#1e293b" stroke-width="4"/>

  <!-- Header -->
  <g transform="translate(200, 260)">
    <text x="0" y="0" class="subtitle">TECHNICAL BLUEPRINT</text>
    <text x="0" y="112" class="title">UTOPIS ROTATING HABITAT</text>
    <line x1="0" y1="168" x2="6000" y2="168" stroke="#334155" stroke-width="8"/>
  </g>

  <!-- ================= VIEW A: AXIAL CROSS-SECTION ================= -->
  <g transform="translate(200, 560)">
    <!-- Header Block -->
    <rect x="0" y="0" width="2880" height="128" fill="#1e293b" rx="16"/>
    <text x="60" y="84" class="section-head">A — AXIAL CROSS-SECTION (LOOKING AFT)</text>
    <text x="2000" y="84" class="dim-text">SPIN 2 rpm • rim 0.89 g • v(rim) 41.9 m/s</text>

    <!-- Main Outer Shield Circle -->
    <g transform="translate(1440, 1240)">
      <!-- Outer Shield (3m) -->
      <circle r="1080" fill="#0f172a" stroke="#475569" stroke-width="8"/>
      <!-- Outer Hull Boundary -->
      <circle r="1063.8" fill="none" stroke="#0284c7" stroke-width="4"/>
      
      <!-- Deck Stack -->
      <circle r="1063.8" fill="none" stroke="#334155" stroke-width="2"/>
      <circle r="1053" fill="#1e293b" stroke="#38bdf8" stroke-width="4" stroke-dasharray="32,16"/> <!-- Deck C -->
      <circle r="1042.2" fill="none" stroke="#38bdf8" stroke-width="3" stroke-dasharray="16,16"/> <!-- Deck B -->
      <circle r="1031.4" fill="none" stroke="#38bdf8" stroke-width="4"/> <!-- Deck A -->

      <!-- Open Cavity Radius -->
      <circle r="1015.2" fill="#090d14" stroke="#1e293b" stroke-width="6"/>

      <!-- Spokes (6 Elevator Shafts) -->
      <g stroke="#0ea5e9" stroke-width="6" stroke-dasharray="24,24" opacity="0.6">
        <line x1="0" y1="0" x2="0" y2="-1015.2"/>
        <line x1="0" y1="0" x2="0" y2="1015.2"/>
        <line x1="0" y1="0" x2="878.8" y2="507.6"/>
        <line x1="0" y1="0" x2="-878.8" y2="507.6"/>
        <line x1="0" y1="0" x2="878.8" y2="-507.6"/>
        <line x1="0" y1="0" x2="-878.8" y2="-507.6"/>
      </g>

      <!-- Axial Core (20m OD -> R=10m -> 54px) -->
      <circle r="54" fill="#0284c7" fill-opacity="0.4" stroke="#38bdf8" stroke-width="8"/>
      <circle r="8" fill="#e0f2fe"/>

      <!-- Annotations / Callouts -->
      <!-- Core Callout -->
      <line x1="-40" y1="-40" x2="-320" y2="-320" stroke="#38bdf8" stroke-width="4"/>
      <line x1="-320" y1="-320" x2="-560" y2="-320" stroke="#38bdf8" stroke-width="4"/>
      <text x="-580" y="-336" class="label-title" text-anchor="end">Axial Core (20 m OD)</text>
      <text x="-580" y="-272" class="label-sub" text-anchor="end">Zero-G / Transit Hub</text>

      <!-- Cavity Callout -->
      <line x1="320" y1="-480" x2="600" y2="-720" stroke="#94a3b8" stroke-width="4"/>
      <line x1="600" y1="-720" x2="920" y2="-720" stroke="#94a3b8" stroke-width="4"/>
      <text x="940" y="-736" class="label-title">OPEN CAVITY Ø 376 m</text>
      <text x="940" y="-672" class="label-sub">Atmospheric volume</text>

      <!-- Deck Stack Callout -->
      <line x1="-880" y1="520" x2="-1160" y2="720" stroke="#38bdf8" stroke-width="4"/>
      <line x1="-1160" y1="720" x2="-1360" y2="720" stroke="#38bdf8" stroke-width="4"/>
      <text x="-1380" y="-8" class="label-title" text-anchor="end" transform="translate(0, 712)">Deck Stack: 3 x 2.0 m (radial)</text>
      <text x="-1380" y="56" class="label-sub" text-anchor="end" transform="translate(0, 712)">"down" = outward; gravity 0.86–0.88 g</text>

      <!-- Whipple Shield Callout -->
      <line x1="760" y1="760" x2="1040" y2="960" stroke="#94a3b8" stroke-width="4"/>
      <line x1="1040" y1="960" x2="1320" y2="960" stroke="#94a3b8" stroke-width="4"/>
      <text x="1340" y="976" class="label-title">Outer Whipple / Radiation Shield — 3 m</text>

      <!-- Elevator Shafts Label -->
      <line x1="480" y1="120" x2="800" y2="120" stroke="#38bdf8" stroke-width="4"/>
      <text x="820" y="136" class="label-sub">Elevator Spoke (1 of 6)</text>

      <!-- Overall Diameter Dimension Line -->
      <line x1="-1080" y1="1180" x2="1080" y2="1180" stroke="#94a3b8" stroke-width="4"/>
      <line x1="-1080" y1="1152" x2="-1080" y2="1208" stroke="#94a3b8" stroke-width="4"/>
      <line x1="1080" y1="1152" x2="1080" y2="1208" stroke="#94a3b8" stroke-width="4"/>
      <text x="0" y="1248" class="label-title" text-anchor="middle">Ø 400 m (overall, incl. shielding)</text>
    </g>
  </g>

  <!-- ================= VIEW B: LONGITUDINAL ELEVATION ================= -->
  <g transform="translate(3320, 560)">
    <!-- Header Block -->
    <rect x="0" y="0" width="2880" height="128" fill="#1e293b" rx="16"/>
    <text x="60" y="84" class="section-head">B — LONGITUDINAL ELEVATION</text>

    <!-- Hull Silhouette -->
    <g transform="translate(240, 160)">
      <!-- Main Drum Hull -->
      <rect x="320" y="160" width="1728" height="2160" fill="#0f172a" stroke="#475569" stroke-width="8"/>
      
      <!-- Fore Nose Sphere (Ø 40m -> R=20m -> 108px) -->
      <path d="M 320 1160 A 108 108 0 0 1 320 1320 Z" fill="#0284c7" fill-opacity="0.3" stroke="#38bdf8" stroke-width="8"/>
      <path d="M 320,1132 A 108,108 0 0,0 320,1348 Z" fill="#1e293b" stroke="#38bdf8" stroke-width="6"/>

      <!-- Axial Core Projection (20m OD -> 108px height along centerline) -->
      <rect x="80" y="1186" width="2160" height="108" fill="#0284c7" fill-opacity="0.2" stroke="#38bdf8" stroke-width="6" stroke-dasharray="16,8"/>

      <!-- Aft Reactor / Engine Compartment (Restricted) -->
      <path d="M 2048 920 L 2320 1000 L 2320 1480 L 2048 1560 Z" fill="#1e293b" stroke="#ef4444" stroke-width="6"/>
      <line x1="2320" y1="1080" x2="2440" y2="1080" stroke="#ef4444" stroke-width="4"/>
      <line x1="2320" y1="1240" x2="2440" y2="1240" stroke="#ef4444" stroke-width="4"/>
      <line x1="2320" y1="1400" x2="2440" y2="1400" stroke="#ef4444" stroke-width="4"/>

      <!-- Deck Stack Lines -->
      <line x1="320" y1="224" x2="2048" y2="224" stroke="#0284c7" stroke-width="4" stroke-dasharray="16,16"/>
      <line x1="320" y1="2256" x2="2048" y2="2256" stroke="#0284c7" stroke-width="4" stroke-dasharray="16,16"/>

      <!-- Portholes -->
      <g fill="#38bdf8">
        <circle cx="480" cy="2256" r="12"/>
        <circle cx="640" cy="2256" r="12"/>
        <circle cx="800" cy="2256" r="12"/>
        <circle cx="960" cy="2256" r="12"/>
        <circle cx="1120" cy="2256" r="12"/>
        <circle cx="1280" cy="2256" r="12"/>
        <circle cx="1440" cy="2256" r="12"/>
        <circle cx="1600" cy="2256" r="12"/>
        <circle cx="1760" cy="2256" r="12"/>
        <circle cx="1920" cy="2256" r="12"/>
      </g>

      <!-- Centerline -->
      <line x1="0" y1="1240" x2="2480" y2="1240" class="center-line"/>

      <!-- Annotations View B -->
      <!-- Core Protrusion Dimension -->
      <line x1="80" y1="1120" x2="2240" y2="1120" stroke="#38bdf8" stroke-width="4"/>
      <line x1="80" y1="1100" x2="80" y2="1140" stroke="#38bdf8" stroke-width="4"/>
      <line x1="2240" y1="1100" x2="2240" y2="1140" stroke="#38bdf8" stroke-width="4"/>
      <text x="1160" y="1092" class="label-title" text-anchor="middle">CORE 400 m (protrudes fore &amp; aft)</text>

      <!-- Drum Length Dimension -->
      <line x1="320" y1="2400" x2="2048" y2="2400" stroke="#f8fafc" stroke-width="4"/>
      <line x1="320" y1="2372" x2="320" y2="2428" stroke="#f8fafc" stroke-width="4"/>
      <line x1="2048" y1="2372" x2="2048" y2="2428" stroke="#f8fafc" stroke-width="4"/>
      <text x="1184" y="2472" class="label-title" text-anchor="middle">DRUM LENGTH 320 m</text>

      <!-- Vertical Overall Diameter -->
      <line x1="2560" y1="160" x2="2560" y2="2320" stroke="#94a3b8" stroke-width="4"/>
      <line x1="2532" y1="160" x2="2588" y2="160" stroke="#94a3b8" stroke-width="4"/>
      <line x1="2532" y1="2320" x2="2588" y2="2320" stroke="#94a3b8" stroke-width="4"/>
      <text x="2620" y="1260" class="label-title" transform="rotate(90, 2620, 1260)" text-anchor="middle">Ø 400 m</text>

      <!-- Nose Callout -->
      <line x1="260" y1="1140" x2="260" y2="720" stroke="#38bdf8" stroke-width="4"/>
      <line x1="260" y1="720" x2="560" y2="720" stroke="#38bdf8" stroke-width="4"/>
      <text x="580" y="700" class="label-title">Nose sphere Ø 40 m</text>
      <text x="580" y="764" class="label-sub">Zero-G gym + docking ring</text>

      <!-- Aft Callout -->
      <line x1="2240" y1="1000" x2="2240" y2="720" stroke="#ef4444" stroke-width="4"/>
      <line x1="2240" y1="720" x2="1920" y2="720" stroke="#ef4444" stroke-width="4"/>
      <text x="1900" y="700" class="label-title" fill="#ef4444" text-anchor="end">Aft reactor / engine compartment</text>
      <text x="1900" y="764" class="label-sub" text-anchor="end">RESTRICTED</text>

      <!-- Porthole Callout -->
      <line x1="1120" y1="2256" x2="1120" y2="2040" stroke="#38bdf8" stroke-width="4"/>
      <line x1="1120" y1="2040" x2="800" y2="2040" stroke="#38bdf8" stroke-width="4"/>
      <text x="780" y="2020" class="label-title" text-anchor="end">1 m hull porthole rows (outer deck)</text>
      <text x="780" y="2084" class="label-sub" text-anchor="end">Flush floor-pane / optical relay system</text>
    </g>
  </g>

  <!-- ================= VIEW C: HULL WALL STACK ================= -->
  <g transform="translate(200, 3080)">
    <!-- Header Block -->
    <rect x="0" y="0" width="2880" height="128" fill="#1e293b" rx="16"/>
    <text x="60" y="84" class="section-head">C — HULL WALL STACK (RADIAL CROSS-SECTION)</text>
    <text x="2040" y="84" class="dim-text">total wall stack = 12.0 m radial</text>

    <!-- Wall Stack Graphic Layout -->
    <g transform="translate(160, 200)">
      <!-- Spin Outer Direction Arrow -->
      <g transform="translate(80, 600)">
        <line x1="0" y1="440" x2="0" y2="-440" stroke="#38bdf8" stroke-width="8"/>
        <polygon points="0,-480 -24,-432 24,-432" fill="#38bdf8"/>
        <text x="-60" y="0" class="label-title" transform="rotate(-90, -60, 0)" text-anchor="middle" fill="#38bdf8">SPIN "DOWN" (outward)</text>
      </g>

      <!-- Layers Box Container -->
      <g transform="translate(320, 80)">
        <!-- Layer 1: Outer Whipple Shield -->
        <rect x="0" y="0" width="1520" height="240" fill="#0f172a" stroke="#475569" stroke-width="6"/>
        <text x="760" y="140" class="label-title" text-anchor="middle">Outer Whipple / radiation shield — 3 m</text>

        <!-- Layer 2: Deck C -->
        <rect x="0" y="240" width="1520" height="160" fill="#1e293b" stroke="#0ea5e9" stroke-width="6"/>
        <text x="60" y="336" class="label-title">Deck C — 2.0 m</text>
        <text x="540" y="336" class="label-sub">(floor r=197 m, 0.88 g)</text>
        <text x="1460" y="336" class="label-title" fill="#38bdf8" text-anchor="end">"bottom floor"</text>

        <!-- Porthole & Optical Relay Detail in Deck C Floor -->
        <g transform="translate(1040, 360)">
          <rect x="-120" y="32" width="240" height="16" fill="#38bdf8" rx="4"/>
          <line x1="-120" y1="40" x2="-120" y2="-120" stroke="#0ea5e9" stroke-dasharray="8,8"/>
          <line x1="120" y1="40" x2="120" y2="-120" stroke="#0ea5e9" stroke-dasharray="8,8"/>
          <path d="M -120,-120 C -40,-40 40,-40 120,-120" fill="none" stroke="#38bdf8" stroke-width="4"/>
        </g>

        <!-- Layer 3: Deck B -->
        <rect x="0" y="400" width="1520" height="160" fill="#172554" stroke="#0ea5e9" stroke-width="4"/>
        <text x="60" y="496" class="label-title">Deck B — 2.0 m</text>
        <text x="540" y="496" class="label-sub">(floor r=195 m, 0.87 g)</text>

        <!-- Layer 4: Deck A -->
        <rect x="0" y="560" width="1520" height="160" fill="#1e293b" stroke="#0ea5e9" stroke-width="4"/>
        <text x="60" y="656" class="label-title">Deck A — 2.0 m</text>
        <text x="540" y="656" class="label-sub">(floor r=193 m, 0.86 g)</text>

        <!-- Layer 5: Pressure Hull / Structure -->
        <rect x="0" y="720" width="1520" height="240" fill="#0f172a" stroke="#475569" stroke-width="6"/>
        <text x="760" y="860" class="label-title" text-anchor="middle">Pressure hull / structure — 3 m</text>
      </g>

      <!-- Optical Porthole Callout Box -->
      <g transform="translate(1920, 80)">
        <rect x="0" y="0" width="720" height="960" fill="#0f172a" stroke="#334155" rx="16"/>
        <text x="48" y="96" class="label-title" fill="#38bdf8">PORTHOLE SYSTEM</text>
        <line x1="48" y1="128" x2="672" y2="128" stroke="#334155" stroke-width="4"/>
        
        <text x="48" y="208" class="data-key">Diameter:</text>
        <text x="48" y="272" class="data-val">1.0 metre (flush)</text>

        <text x="48" y="384" class="data-key">Safety Standard:</text>
        <text x="48" y="448" class="data-val">Safe to walk on</text>
        <text x="48" y="504" class="dim-text">(No shoes requested)</text>

        <text x="48" y="616" class="data-key">Optics Configuration:</text>
        <text x="48" y="688" class="data-val">• Dual-pane relay</text>
        <text x="48" y="752" class="data-val">  (gun/tele/microscope)</text>
        <text x="48" y="816" class="data-val">• Eliminates tunnel</text>
        <text x="48" y="880" class="data-val">  sight / tube view</text>
      </g>
    </g>
  </g>

  <!-- ================= VIEW D: DATA & SPECIFICATIONS ================= -->
  <g transform="translate(3320, 3080)">
    <!-- Header Block -->
    <rect x="0" y="0" width="2880" height="128" fill="#1e293b" rx="16"/>
    <text x="60" y="84" class="section-head">D — TECHNICAL SPECIFICATIONS</text>

    <!-- Specifications Table Layout -->
    <g transform="translate(80, 200)">
      <!-- Row 1: Vehicle -->
      <rect x="0" y="0" width="2720" height="144" fill="#0f172a" rx="8"/>
      <text x="60" y="88" class="data-key">VEHICLE</text>
      <text x="560" y="88" class="data-val">Utopis rotating habitat — cylindrical drum Ø 400 m x 320 m length.</text>

      <!-- Row 2: Spin -->
      <rect x="0" y="176" width="2720" height="192" fill="#1e293b" rx="8"/>
      <text x="60" y="264" class="data-key">SPIN</text>
      <text x="560" y="264" class="data-val">2 rpm → 0.89 g at rim (r=200 m); 0.86–0.88 g across the three decks;</text>
      <text x="560" y="328" class="data-val">rim speed 41.9 m/s. 0.9 g target matches inhabited exomoon orbit.</text>

      <!-- Row 3: Decks -->
      <rect x="0" y="400" width="2720" height="192" fill="#0f172a" rx="8"/>
      <text x="60" y="488" class="data-key">DECKS</text>
      <text x="560" y="488" class="data-val">3 radially stacked decks of 2.0 m clear height between r=191 m and r=197 m.</text>
      <text x="560" y="552" class="data-val">Lowest deck carries 1 m floor porthole rows with composite optical relay panes.</text>

      <!-- Row 4: Core -->
      <rect x="0" y="624" width="2720" height="256" fill="#1e293b" rx="8"/>
      <text x="60" y="720" class="data-key">CORE</text>
      <text x="560" y="720" class="data-val">Zero-G spine Ø 20 m OD (400 m length, protrudes fore &amp; aft).</text>
      <text x="560" y="784" class="data-val">Fore: Ø 40 m sphere — zero-G gym + docking ring.</text>
      <text x="560" y="848" class="data-val">Aft: reactor / engine compartment — RESTRICTED. 3 of 6 spokes act as elevators.</text>
    </g>

    <!-- Blueprint Footer Note -->
    <g transform="translate(80, 1160)">
      <text x="2720" y="0" class="dim-text" text-anchor="end">Rev 2.1 • All dimensions in metres • Core OD = 20 m confirmed</text>
    </g>
  </g>

</svg>
