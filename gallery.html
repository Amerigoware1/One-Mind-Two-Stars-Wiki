<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Gallery – One Mine Two Stars Wiki</title>
  <link rel="icon" type="image/png" href="assets/images/favicon.png">
  <link rel="stylesheet" href="wikistyle.css">

  <!--PhotoSwipe CSS-->
<link rel="stylesheet" href="photoswipe.css">

  <style>
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(2,-1fr);
      gap: 1rem;
      margin-top: 1.5rem;
    }
    @media (min-width:-768px) { .gallery-grid { grid-template-columns: repeat(3,-1fr); } }
    @media (min-width:-1024px) { .gallery-grid { grid-template-columns: repeat(4,-1fr); } }

    .card-bg {
      background: #0a0022;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 4px 8px rgba(0,0,0,0.3);
      text-align: center;
      padding: 0.5rem;
      cursor: pointer;
      transition: box-shadow 0.2s;
      display: flex;
      flex-direction: column;
      height: 100%;
    }
    .card-bg:hover {
      box-shadow: 0 6px 12px rgba(0,0,0,0.4);
      transform: translateY(-2px);
    }
    .card-bg img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      border-radius: 4px;
    }
    .card-title {
      margin-top: 0.5rem;
      font-weight: bold;
      color: #fff;
      font-size: 0.95rem;
    }
    .card-description {
      margin-top: 0.25rem;
      font-size: 0.8rem;
      color: #aaa;
      line-height: 1.3;
      flex-grow: 1;
    }
    .card-tags {
      margin-top: 0.5rem;
      font-size: 0.7rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.25rem;
      justify-content: center;
    }
    .tag {
      background: #1e0a47;
      color: #b79aff;
      padding: 0.2rem 0.5rem;
      border-radius: 12px;
      font-size: 0.65rem;
      text-transform: lowercase;
    }
    
    /* Search and filter styling */
    .gallery-controls {
      display: flex;
      gap: 1rem;
      margin: 1rem 0 1.5rem;
      flex-wrap: wrap;
    }
    
    #gallery-search {
      flex: 2;
      min-width: 250px;
      padding: 0.5rem 0.75rem;
      font-size: 1rem;
      border: 1px solid #1e0a47;
      border-radius: 6px;
      background: #0c0028;
      color: inherit;
    }

    #gallery-search:focus,
    #tag-filter:focus {
      outline: none;
      border-color: #7b4fd4;
    }
    
    #tag-filter {
      flex: 1;
      min-width: 150px;
      padding: 0.5rem 0.75rem;
      font-size: 1rem;
      border: 1px solid #1e0a47;
      border-radius: 6px;
      background: #0c0028;
      color: inherit;
      cursor: pointer;
    }
    
    #tag-filter option {
      background: #0c0028;
      color: inherit;
    }
    
    #no-results {
      text-align: center;
      padding: 2rem;
      color: #aaa;
      font-style: italic;
      grid-column: 1/-1;
    }
    
    /* Loading state */
    .loading {
      grid-column: 1/-1;
      text-align: center;
      padding: 2rem;
      color: #7b4fd4;
    }
  </style>
</head>
<body class="p-4">
<div class="card-bg">
    <h1>Gallery</h1>
    A collection of artifacts, environments, and curiosities from <em>One Mind Two Stars</em>.
  </div>

  <!--Search and filter controls-->
  <div class="gallery-controls">
    <input
      type="text"
      id="gallery-search"
      placeholder="Search by title, description, or tags…"
      autocomplete="off"
    >
    
    <select id="tag-filter">
      <option value="">All Tags</option>
    </select>
  </div>

  <!--Gallery will be inserted here-->
  <div id="gallery" class="gallery-grid">
    <div class="loading">Loading gallery...</div>
  </div>

  <!--Footer-->
  <div id="footer">
    <p>Back to <a href="{{ '/index.html' | relative_url }}">Home</a></p>
    <p>&copy; One Mine Two Stars Wiki</p>
  </div>

  <!--Return to Top-->
  </body>
</html>
