<body>

<div class="terminal">
    <div class="header">
        <h1>⛭ ARES · NAV CALC</h1>
        <div class="origin">ORIGIN: <span>NEW EDEN</span> &nbsp; 00°25'24.0"S / 000°00'00.0"E</div>
    </div>

    <div class="input-group">
        <div class="field">
            <label for="bearingSelect">BEARING</label>
            <select id="bearingSelect">
                <option value="0">N (000°)</option>
                <option value="22.5" selected>NNE (022.5°)</option>
                <option value="45">NE (045°)</option>
                <option value="67.5">ENE (067.5°)</option>
                <option value="90">E (090°)</option>
                <option value="112.5">ESE (112.5°)</option>
                <option value="135">SE (135°)</option>
                <option value="157.5">SSE (157.5°)</option>
                <option value="180">S (180°)</option>
                <option value="202.5">SSW (202.5°)</option>
                <option value="225">SW (225°)</option>
                <option value="247.5">WSW (247.5°)</option>
                <option value="270">W (270°)</option>
                <option value="292.5">WNW (292.5°)</option>
                <option value="315">NW (315°)</option>
                <option value="337.5">NNW (337.5°)</option>
            </select>
        </div>

        <div class="field">
            <label for="distanceInput">DISTANCE (KM)</label>
            <input type="number" id="distanceInput" value="2000" step="0.1" min="0">
            <div class="hint">max 20,000 km (half circumference)</div>
        </div>
    </div>

    <div class="field" style="margin-bottom: 12px;">
        <label for="customBearing">OR ENTER CUSTOM BEARING (DEGREES)</label>
        <input type="number" id="customBearing" placeholder="e.g. 37.2" step="0.1" min="0" max="360">
    </div>

    <div class="actions">
        <button id="calcBtn">▷ CALCULATE</button>
        <button id="resetBtn" class="secondary">⟲ RESET</button>
    </div>

    <div id="errorMsg" class="error"></div>

    <div id="resultArea" class="result-box" style="display: none;">
        <div class="label">▼ DESTINATION GEODETIC</div>
        <div class="coords">
            <div class="item" id="latDMS">—</div>
            <div class="item" id="lonDMS">—</div>
        </div>
        <div style="margin-top: 4px; color: #3f5f6f; font-size: 13px;">
            <span id="latDec">—</span> &nbsp;·&nbsp; <span id="lonDec">—</span>
        </div>
        <div class="summary" id="summaryLine">—</div>
    </div>

    <div class="footer">LUNAR RADIUS: 6371 KM · SPHERICAL MODEL</div>
</div>

<script>
    (function() {
        // ---- CONSTANTS ----
        const R = 5600; // near Earth-sized moon radius in km
        const ORIGIN_LAT_DEC = -0.423333; // 00°25'24.0"S
        const ORIGIN_LON_DEC = 0.0;

        // ---- DOM refs ----
        const bearingSelect = document.getElementById('bearingSelect');
        const customBearing = document.getElementById('customBearing');
        const distanceInput = document.getElementById('distanceInput');
        const calcBtn = document.getElementById('calcBtn');
        const resetBtn = document.getElementById('resetBtn');
        const resultArea = document.getElementById('resultArea');
        const latDMS = document.getElementById('latDMS');
        const lonDMS = document.getElementById('lonDMS');
        const latDec = document.getElementById('latDec');
        const lonDec = document.getElementById('lonDec');
        const summaryLine = document.getElementById('summaryLine');
        const errorMsg = document.getElementById('errorMsg');

        // ---- Helper: decimal → DMS string ----
        function decToDMS(dec, isLat) {
            const abs = Math.abs(dec);
            const deg = Math.floor(abs);
            const minFloat = (abs - deg) * 60;
            const min = Math.floor(minFloat);
            const sec = ((minFloat - min) * 60);
            const roundedSec = Math.round(sec * 10) / 10; // one decimal

            let dir = '';
            if (isLat) {
                dir = (dec >= 0) ? 'N' : 'S';
            } else {
                dir = (dec >= 0) ? 'E' : 'W';
            }
            // Pad degrees/minutes with leading zeros
            const degStr = String(deg).padStart(2, '0');
            const minStr = String(min).padStart(2, '0');
            const secStr = roundedSec.toFixed(1).padStart(4, '0');
            return `${degStr}°${minStr}'${secStr}"${dir}`;
        }

        // ---- Core navigation: destination from start + bearing + distance ----
        function calculateDestination(lat1Deg, lon1Deg, bearingDeg, distKm) {
            const lat1 = lat1Deg * Math.PI / 180;
            const lon1 = lon1Deg * Math.PI / 180;
            const theta = bearingDeg * Math.PI / 180;
            const delta = distKm / R; // angular distance

            const lat2 = Math.asin(
                Math.sin(lat1) * Math.cos(delta) +
                Math.cos(lat1) * Math.sin(delta) * Math.cos(theta)
            );

            const lon2 = lon1 + Math.atan2(
                Math.sin(theta) * Math.sin(delta) * Math.cos(lat1),
                Math.cos(delta) - Math.sin(lat1) * Math.sin(lat2)
            );

            return {
                lat: lat2 * 180 / Math.PI,
                lon: lon2 * 180 / Math.PI
            };
        }

        // ---- render result ----
        function renderResult(bearingDeg, distKm, dest) {
            const lat = dest.lat;
            const lon = dest.lon;

            // DMS
            latDMS.textContent = decToDMS(lat, true);
            lonDMS.textContent = decToDMS(lon, false);

            // Decimal
            latDec.textContent = lat.toFixed(6) + '°';
            lonDec.textContent = lon.toFixed(6) + '°';

            // Summary
            const dirMap = {
                '0': 'due North', '22.5': 'NNE', '45': 'NE', '67.5': 'ENE',
                '90': 'due East', '112.5': 'ESE', '135': 'SE', '157.5': 'SSE',
                '180': 'due South', '202.5': 'SSW', '225': 'SW', '247.5': 'WSW',
                '270': 'due West', '292.5': 'WNW', '315': 'NW', '337.5': 'NNW'
            };
            const dirName = dirMap[String(bearingDeg)] || bearingDeg.toFixed(1) + '°';

            // Determine if destination is N/S/E/W of New Eden
            const latDiff = lat - ORIGIN_LAT_DEC;
            const lonDiff = lon - ORIGIN_LON_DEC;
            const northSouth = (latDiff > 0.001) ? 'north' : (latDiff < -0.001) ? 'south' : '';
            const eastWest = (lonDiff > 0.001) ? 'east' : (lonDiff < -0.001) ? 'west' : '';

            let directionPhrase = '';
            if (northSouth && eastWest) directionPhrase = `${northSouth} and ${eastWest}`;
            else if (northSouth) directionPhrase = northSouth;
            else if (eastWest) directionPhrase = eastWest;
            else directionPhrase = 'the same location';

            summaryLine.innerHTML = `
                <em>${distKm.toFixed(1)} km</em> ${dirName} from New Eden places you 
                <em>${directionPhrase}</em> of the capital.
                ${Math.abs(latDiff) > 1 ? ' (Crossed the equator!)' : ''}
            `;

            resultArea.style.display = 'block';
        }

        // ---- main calculate ----
        function calculate() {
            errorMsg.style.display = 'none';
            errorMsg.textContent = '';

            // Get distance
            const dist = parseFloat(distanceInput.value);
            if (isNaN(dist) || dist < 0) {
                errorMsg.textContent = '⚠ Invalid distance. Enter a positive number.';
                errorMsg.style.display = 'block';
                return;
            }
            if (dist > R * Math.PI) {
                errorMsg.textContent = `⚠ Distance exceeds half-circumference (${(R * Math.PI).toFixed(0)} km). Use a shorter range.`;
                errorMsg.style.display = 'block';
                return;
            }

            // Get bearing: prefer custom if filled, else dropdown
            let bearingDeg;
            const customVal = customBearing.value.trim();
            if (customVal !== '') {
                bearingDeg = parseFloat(customVal);
                if (isNaN(bearingDeg) || bearingDeg < 0 || bearingDeg >= 360) {
                    errorMsg.textContent = '⚠ Custom bearing must be between 0 and 360.';
                    errorMsg.style.display = 'block';
                    return;
                }
            } else {
                bearingDeg = parseFloat(bearingSelect.value);
            }

            // Calculate
            const dest = calculateDestination(ORIGIN_LAT_DEC, ORIGIN_LON_DEC, bearingDeg, dist);
            renderResult(bearingDeg, dist, dest);
        }

        // ---- reset ----
        function resetForm() {
            bearingSelect.value = '22.5';
            customBearing.value = '';
            distanceInput.value = '2000';
            resultArea.style.display = 'none';
            errorMsg.style.display = 'none';
            errorMsg.textContent = '';
        }

        // ---- sync: clear custom when dropdown changes ----
        bearingSelect.addEventListener('change', function() {
            if (this.value !== '') {
                customBearing.value = '';
            }
        });

        customBearing.addEventListener('input', function() {
            if (this.value.trim() !== '') {
                bearingSelect.value = '';
            }
        });

        // ---- events ----
        calcBtn.addEventListener('click', calculate);
        resetBtn.addEventListener('click', resetForm);

        // Enter key on distance or custom bearing triggers calc
        distanceInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') calculate(); });
        customBearing.addEventListener('keydown', (e) => { if (e.key === 'Enter') calculate(); });

        // ---- auto-run on load with default (2000km NNE) ----
        window.addEventListener('load', function() {
            // ensure defaults
            bearingSelect.value = '22.5';
            distanceInput.value = '2000';
            calculate();
        });

    })();
</script>

</body>
</html>
