<div class="banner-container">
  <span class="banner-title">One Mind, Two Stars Wiki</span>
    <div class="top-banner">
    <a href="index.html" class="home-button">🏠 Home</a>
  
  <nav class="banner-nav" id="dynamic-banner-nav"></nav>
  </div>
</div>

<script>
  document.addEventListener("DOMContentLoaded", function() {
    const bannerNav = document.getElementById('dynamic-banner-nav');
    
    // 1. First, check if we are on a dossier page with a specific sub-return link
    const dossierReturnLink = document.querySelector('.return-link');
    // 2. Next, check if there is a main section link in the footer
    const footerCharactersLink = document.querySelector('.site-footer a[href*="characters"]');

    if (dossierReturnLink) {
      // If reading a dossier, clone its specific "Return to [Character]" link to the top banner
      const topBtn = dossierReturnLink.cloneNode(true);
      topBtn.className = 'banner-btn'; // Strip old styles, apply the banner button look
      // Make sure it reads cleanly at the top
      topBtn.innerHTML = `‹ ${topBtn.textContent.trim()}`;
      bannerNav.appendChild(topBtn);
    } else if (footerCharactersLink) {
      // If on a regular character layout page, clone the main Directory link up to the top
      const topBtn = footerCharactersLink.cloneNode(true);
      topBtn.className = 'banner-btn';
      topBtn.innerHTML = `‹ Characters Hub`;
      bannerNav.appendChild(topBtn);
    }
  });
</script>
