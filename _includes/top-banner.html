
<div class="top-banner">
  <div style="display: flex; justify-content: space-between; align-items: center; max-width: 1200px; margin: 0 auto;">
    
    <span class="banner-title" style="font-family: 'Orbitron', sans-serif; font-weight: 700; font-size: 1.1rem; color: #ffffff;">
      One Mind, Two Stars Wiki
    </span>
      <span class="page-title">{{ page.title | default: "" }}</span>

    <div style="display: flex; align-items: center; gap: 1rem;">
      <a href="{{ '/' | relative_url }}" class="home-button">🏠 Home</a><a href="{{ '/glossary.html' | relative_url }}" class="home-button">📘 Glossary</a> 
      <span id="dynamic-banner-nav" style="display: flex; gap: 1rem;"></span>
    </div>

  </div>
</div>

<script>
  document.addEventListener("DOMContentLoaded", function() {
    const bannerNav = document.getElementById('dynamic-banner-nav');
    if (!bannerNav) return;

    // 1. Grab Jekyll variables from the front-matter
    const currentLayout = "{{ page.layout }}";
    
    // FIX: Added === "true" so it evaluates as a real boolean
    const isSampleChapter = "{{ page.sample_chapter | default: false }}" === "true";
    const seriesOverviewUrl = "{{ page.return_url | relative_url }}";
    
    // Grab the dossier marker and URL from front-matter
    const isDossier = "{{ page.is_dossier | default: false }}" === "true";
    const dossierReturnUrl = "{{ page.return_url | relative_url }}";
    const dossierReturnLabel = "{{ page.return_label | default: 'Return to Dossier' }}";
    
    // FIX: Added === "true" here as well, otherwise it suffers from the exact same bug!
    const isArchive = "{{ page.is_archive | default: false }}" === "true";
    const archiveReturnUrl = "{{ page.return_url | relative_url }}";
    const archiveReturnLabel = "{{ page.return_label | default: 'Return to Archive' }}";
    
    // SCENARIO A: Inside a medical/care sub-dossier layout
    if (isDossier && dossierReturnUrl) {
      const topBtn = document.createElement('a');
      topBtn.href = dossierReturnUrl;
      topBtn.className = 'home-button';
      topBtn.textContent = `‹🧍‍♀️ ${dossierReturnLabel}`;
      bannerNav.appendChild(topBtn);
    } 
    
    // SCENARIO B: On a standard biography layout page
    else if (currentLayout === 'character') {
      const topBtn = document.createElement('a');
      topBtn.href = "{{ '/_characters/' | relative_url }}"; 
      topBtn.className = 'home-button';
      topBtn.textContent = "‹👨🏻‍👩🏻‍👦🏻‍👦🏻 Return to Characters";
      bannerNav.appendChild(topBtn);
    }
    
    // SCENARIO C: Sample chapter pages → Return to Series Overview
    else if (isSampleChapter) {
      const topBtn = document.createElement('a');
      topBtn.href = seriesOverviewUrl; 
      topBtn.className = 'home-button';
      topBtn.textContent = "‹📚 Series Overview";
      bannerNav.appendChild(topBtn);
    }
    
    // SCENARIO D: On an anthology story page → Return to index
    else if (isArchive) {
      const topBtn = document.createElement('a');
      topBtn.href = archiveReturnUrl;
      topBtn.className = 'home-button';
      topBtn.textContent = `‹📖 ${archiveReturnLabel}`;
      bannerNav.appendChild(topBtn);
    }
    
    // SCENARIO E: The hub list directory or homepage --> Does nothing!
  });
</script>
<style>
.page-title {

  /* 1. Apply the gradient as a background instead of a text color */
  background: linear-gradient(180deg, #d15eed, #00ffff);
  
  /* 2. Clip the background so it only shows through the text characters */
  -webkit-background-clip: text;
  background-clip: text;
  
  /* 3. Make the actual text transparent so the background gradient shines through */
  -webkit-text-fill-color: transparent;
  
  /* Optional: Make it bold so the gradient has more surface area to show off */
  font-family: 'Orbitron', sans-serif;
  font-size: 1.8rem;
  font-weight: bold;
  /*text-shadow: 0 0 8px rgba(0, 255, 255, 0.6);  Adds a subtle cyan energy hum behind it */
  margin-left: 1rem;   /* Prevent crowding next to the site title */ 
}
.top-banner {
  /* A rich, shifting sci-fi palette: deep void, nebula purple, and starlight blue */
  background: linear-gradient(125deg, #13132b, #241442, #0f3d59, #411c1c);
  background-size: 400% 400%; /* Makes the gradient huge so we can move around inside it */
  animation: color-swirl 15s ease infinite;
}

@keyframes color-swirl {
  0% {
    background-position: 0% 50%;
  }
  50% {
    background-position: 100% 50%;
  }
  100% {
    background-position: 0% 50%;
  }
}
