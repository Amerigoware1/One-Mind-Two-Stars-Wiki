<script>
  document.addEventListener("DOMContentLoaded", function() {
    const bannerNav = document.getElementById('dynamic-banner-nav');
    if (!bannerNav) return;

    // 1. Grab Jekyll variables from the front-matter
    const currentLayout = "{{ page.layout }}";
    
    // FIX: Added === "true" so it evaluates as a real boolean
    const isSampleChapter = "{{ page.sample_chapter | default: false }}" === "true";
    const seriesOverviewUrl = "{{ page.return_url | relative_url }}";
    
    // Grab the dossier marker and URL from front-matter
    const isDossier = "{{ page.is_dossier | default: false }}" === "true";
    const dossierReturnUrl = "{{ page.return_url | relative_url }}";
    const dossierReturnLabel = "{{ page.return_label | default: 'Return to Dossier' }}";
    
    // FIX: Added === "true" here as well, otherwise it suffers from the exact same bug!
    const isArchive = "{{ page.is_archive | default: false }}" === "true";
    const archiveReturnUrl = "{{ page.return_url | relative_url }}";
    const archiveReturnLabel = "{{ page.return_label | default: 'Return to Archive' }}";
    
    // SCENARIO A: Inside a medical/care sub-dossier layout
    if (isDossier && dossierReturnUrl) {
      const topBtn = document.createElement('a');
      topBtn.href = dossierReturnUrl;
      topBtn.className = 'home-button';
      topBtn.textContent = `‹ ${dossierReturnLabel}`;
      bannerNav.appendChild(topBtn);
    } 
    
    // SCENARIO B: On a standard biography layout page
    else if (currentLayout === 'character') {
      const topBtn = document.createElement('a');
      topBtn.href = "{{ '/_characters/' | relative_url }}"; 
      topBtn.className = 'home-button';
      topBtn.textContent = "‹ Characters Hub";
      bannerNav.appendChild(topBtn);
    }
    
    // SCENARIO C: Sample chapter pages → Return to Series Overview
    else if (isSampleChapter) {
      const topBtn = document.createElement('a');
      topBtn.href = seriesOverviewUrl; 
      topBtn.className = 'home-button';
      topBtn.textContent = "‹ Series Overview";
      bannerNav.appendChild(topBtn);
    }
    
    // SCENARIO D: On an anthology story page → Return to index
    else if (isArchive) {
      const topBtn = document.createElement('a');
      topBtn.href = archiveReturnUrl;
      topBtn.className = 'home-button';
      topBtn.textContent = `‹ ${archiveReturnLabel}`;
      bannerNav.appendChild(topBtn);
    }
    
    // SCENARIO E: The hub list directory or homepage --> Does nothing!
  });
</script>
