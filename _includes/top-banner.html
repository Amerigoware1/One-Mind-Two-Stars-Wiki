<div class="top-banner">
  <div style="display: flex; justify-content: space-between; align-items: center; max-width: 1200px; margin: 0 auto;">
    
    <span class="banner-title" style="font-family: 'Orbitron', sans-serif; font-weight: 700; font-size: 1.1rem; color: #ffffff;">
      One Mind, Two Stars Wiki
    </span>
    <span class="page-title">{{ page.title | default: "" }}</span>

    <div style="display: flex; align-items: center; gap: 1rem;">
      <a href="{{ '/' | relative_url }}" class="home-button">🏠 Home</a>
      <a href="{{ '/glossary.html' | relative_url }}" class="home-button">📘 Glossary</a> 
      
      <select id="themeSelect" aria-label="Choose theme">
        <option value="neon">Neon</option>
        <option value="gold">Gold</option>
        <option value="holo">Holo</option>
      </select>
      
      <span id="dynamic-banner-nav" style="display: flex; gap: 1rem;"></span>
    </div>

  </div>
</div>

<script>
(function () {
  const select = document.getElementById('themeSelect');
  if (!select) return;

  function applyTheme(theme) {
    document.body.classList.remove('theme-gold', 'theme-holo');
    if (theme === 'gold') {
      document.body.classList.add('theme-gold');
    } else if (theme === 'holo') {
      document.body.classList.add('theme-holo');
    }
    localStorage.setItem('preferred-theme', theme);
    select.value = theme;
  }

  // Restore saved theme immediately
  const saved = localStorage.getItem('preferred-theme') || 'neon';
  applyTheme(saved);

  // Listen for changes
  select.addEventListener('change', function () {
    applyTheme(select.value);
  });
})();

// Dynamic banner navigation (runs after DOM is ready)
document.addEventListener("DOMContentLoaded", function() {
  const bannerNav = document.getElementById('dynamic-banner-nav');
  if (!bannerNav) return;

  const currentLayout = "{{ page.layout }}";
  const isSampleChapter = "{{ page.sample_chapter | default: false }}" === "true";
  const seriesOverviewUrl = "{{ page.return_url | relative_url }}";
  
  const isDossier = "{{ page.is_dossier | default: false }}" === "true";
  const dossierReturnUrl = "{{ page.return_url | relative_url }}";
  const dossierReturnLabel = "{{ page.return_label | default: 'Return to Character' }}";
  const glossaryReturnUrl = "{{ '/glossary.html#medical' | relative_url }}";
  const glossaryReturnLabel = "Return to Glossary (Medical)";

  const isArchive = "{{ page.is_archive | default: false }}" === "true";
  const archiveReturnUrl = "{{ page.return_url | relative_url }}";
  const archiveReturnLabel = "{{ page.return_label | default: 'Return to Archive' }}";

  const isBuildingPage = "{{ page.is_building | default: false }}" === "true";
  const buildingReturnUrl = "{{ '/central-buildings.html' | relative_url }}";
  const NewEdenReturnUrl = "{{ '/new-eden.html' | relative_url }}";
  const buildingReturnLabel = "{{ page.return_label | default: 'Return to Central Buildings' }}";
  const NewEdenReturnLabel = "{{ page.return_label | default: 'Return to New Eden' }}";
  
  if (isDossier && dossierReturnUrl) {
    const topBanner = bannerNav.closest('.top-banner');
    if (topBanner) {
      const existingGlossaryBtn = topBanner.querySelector('a[href$="glossary.html"]');
      if (existingGlossaryBtn) existingGlossaryBtn.remove();
    }
    const topBtn = document.createElement('a');
    topBtn.href = dossierReturnUrl;
    topBtn.className = 'home-button';
    topBtn.textContent = `‹🧍‍♀️ ${dossierReturnLabel}`;
    bannerNav.appendChild(topBtn);
    
    const glossaryBtn = document.createElement('a');
    glossaryBtn.href = glossaryReturnUrl;
    glossaryBtn.className = 'home-button';
    glossaryBtn.textContent = `‹📘 ${glossaryReturnLabel}`;
    bannerNav.appendChild(glossaryBtn);
  } 
  else if (currentLayout === 'character') {
    const topBtn = document.createElement('a');
    topBtn.href = "{{ '/_characters/' | relative_url }}"; 
    topBtn.className = 'home-button';
    topBtn.textContent = "‹👨🏻‍👩🏻‍👦🏻‍👦🏻 Return to Characters";
    bannerNav.appendChild(topBtn);
  }
  else if (isSampleChapter) {
    const topBtn = document.createElement('a');
    topBtn.href = seriesOverviewUrl; 
    topBtn.className = 'home-button';
    topBtn.textContent = "‹📚 Series Overview";
    bannerNav.appendChild(topBtn);
  }
  else if (isArchive) {
    const topBtn = document.createElement('a');
    topBtn.href = archiveReturnUrl;
    topBtn.className = 'home-button';
    topBtn.textContent = `‹📖 ${archiveReturnLabel}`;
    bannerNav.appendChild(topBtn);
  }
  else if (isBuildingPage) {
    const topBtnA = document.createElement('a');
    topBtnA.href = buildingReturnUrl;
    topBtnA.className = 'home-button';
    topBtnA.textContent = `‹🏛️ Return to Central Buildings`;
    bannerNav.appendChild(topBtnA);
    
    const topBtnB = document.createElement('a');
    topBtnB.href = NewEdenReturnUrl;
    topBtnB.className = 'home-button';
    topBtnB.textContent = `‹🏛️ Return to New Eden`;
    bannerNav.appendChild(topBtnB);
  }
});
</script>

<style>
/* Page title – Neon (default) */
.page-title {
  background: linear-gradient(90deg, #d15eed, #00ffff);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  font-family: 'Orbitron', sans-serif;
  font-size: 1.8rem;
  font-weight: bold;
  margin-left: 1rem;
}

/* Top banner background – Neon */
.top-banner {
  background: linear-gradient(125deg, #13132b, #241442, #0f3d59, #411c1c);
  background-size: 400% 400%;
  animation: color-swirl 6s ease infinite;
}

/* Gold overrides */
body.theme-gold .top-banner {
  background: linear-gradient(125deg, #030303, #0a0a0a, #10100c, #16140e);
  background-size: 400% 400%;
}

body.theme-gold .page-title {
  background: linear-gradient(90deg, #fff8e0, #f5e6a3 25%, #d4af37 50%, #a67c00 80%, #e8d48b);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
}

/* Holo overrides */
body.theme-holo .top-banner {
  background: linear-gradient(125deg, #02040a, #041220, #0a1a2e, #12081c);
  background-size: 400% 400%;
}

body.theme-holo .page-title {
  background: linear-gradient(90deg, #00f5ff, #c77dff 40%, #ff00aa 70%, #00f5ff);
  background-size: 200% auto;
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  animation: holoText 6s linear infinite;
}

@keyframes color-swirl {
  0%   { background-position: 0% 50%; }
  50%  { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

@keyframes holoText {
  0%   { background-position: 0% center; }
  100% { background-position: 200% center; }
}
</style>
