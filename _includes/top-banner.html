<div class="top-banner">
  <div style="display: flex; justify-content: space-between; align-items: center; max-width: 1200px; margin: 0 auto;">
    
    <span class="banner-title" style="font-family: 'Orbitron', sans-serif; font-weight: 700; font-size: 1.1rem; color: #ffffff;">
      One Mind, Two Stars Wiki
    </span>
      
    <div style="display: flex; align-items: center; gap: 1rem;">
      <a href="{{ '/' | relative_url }}" class="home-button">🏠 Home</a>
      <span id="dynamic-banner-nav" style="display: flex; gap: 1rem;"></span>
    </div>

  </div>
</div>

<script>
  document.addEventListener("DOMContentLoaded", function() {
    const bannerNav = document.getElementById('dynamic-banner-nav');
    if (!bannerNav) return;

    // 1. Grab the precise layout type from our new body marker
    const currentLayout = document.body.getAttribute('data-layout');

    // 2. Scan the active page for relevant return links
    const dossierReturnLink = document.querySelector('.return-link');
    const footerCharactersLink = document.querySelector('.site-footer a[href*="characters"]');

    // SCENARIO A: We are deep inside a sub-dossier layout
    if (dossierReturnLink) {
      const topBtn = dossierReturnLink.cloneNode(true);
      topBtn.className = 'banner-btn';
      topBtn.innerHTML = `‹ ${topBtn.textContent.replace(/Return to/i, '').trim()}`;
      bannerNav.appendChild(topBtn);
    } 
    
    // SCENARIO B: We are on a standard character biography page
    // (Only show the button if the layout is explicitly 'character')
    else if (footerCharactersLink && currentLayout === 'character') {
      const topBtn = footerCharactersLink.cloneNode(true);
      topBtn.className = 'banner-btn';
      topBtn.innerHTML = `‹ Characters Hub`;
      bannerNav.appendChild(topBtn);
    }
    
    // SCENARIO C: Any other page (home, hub list, timeline) -> Do absolutely nothing!
  });
</script>
