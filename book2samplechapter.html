<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book 2, Chapter 1 Sample</title>
  <link rel="icon" type="image/png" href="assets/images/favicon.png">
  <link rel="stylesheet" href="wikistyle.css?v=3">
</head>

<style>
  /* Prevents users from highlighting or selecting text/images */
  .unselectable {
    -webkit-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;
    user-select: none;
  }

  .reader-container {
    position: relative;
    display: inline-block;
    max-width: 800px;
    border: 1px solid #ccc;
  }

  /* The Invisible Shield */
  .shield {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 10;
    background: rgba(255,-255, 255, 0); /* Completely transparent */
  }
.page {
  display: none;
  opacity: 0;
  transition: opacity 0.5s ease-in-out;
}

.page.active {
  display: block;
  opacity: 1;
}

.nav-controls {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px;
  background: #f9f9f9;
  border-top: 1px solid #ccc;
}
  button {
  padding: 8px 15px;
  cursor: pointer;
  background-color: #333;
  color: white;
  border: none;
  border-radius: 4px;
}

button:disabled {
  background-color: #ccc;
  cursor: not-allowed;
}
</style>
<body>
<h1>Book 2, Chapter 1 Sample</h1>
<div class="reader-container unselectable" oncontextmenu="return false;">
  <div class="shield"></div>
  
  <div id="page-viewer">
    <div class="card-bg page"><img src="assets/samples/book2/chapter1-page1.jpg" loading="lazy" style="width:100%; display:block;" alt="Page 1" draggable="false"></div>
    <div class="card-bg page"><img src="assets/samples/book2/chapter1-page2.jpg" loading="lazy" style="width:100%; display:block;" alt="Page 2" draggable="false"></div>
    <div class="card-bg page"><img src="assets/samples/book2/chapter1-page3.jpg" loading="lazy" style="width:100%; display:block;" alt="Page 3" draggable="false"></div>
    <div class="card-bg page"><img src="assets/samples/book2/chapter1-page4.jpg" loading="lazy" style="width:100%; display:block;" alt="Page 4" draggable="false"></div>
    <div class="card-bg page"><img src="assets/samples/book2/chapter1-page5.jpg" loading="lazy" style="width:100%; display:block;" alt="Page 5" draggable="false"></div>
    <div class="card-bg page"><img src="assets/samples/book2/chapter1-page6.jpg" loading="lazy" style="width:100%; display:block;" alt="Page 6" draggable="false"></div>
    <div class="card-bg page"><img src="assets/samples/book2/chapter1-page7.jpg" loading="lazy" style="width:100%; display:block;" alt="Page 7" draggable="false"></div>
    <div class="card-bg page"><img src="assets/samples/book2/chapter1-page8.jpg" loading="lazy" style="width:100%; display:block;" alt="Page 8" draggable="false"></div>
    <div class="card-bg page"><img src="assets/samples/book2/chapter1-page9.jpg" loading="lazy" style="width:100%; display:block;" alt="Page 9" draggable="false"></div>
    <div class="card-bg page"><img src="assets/samples/book2/chapter1-page10.jpg" loading="lazy" style="width:100%; display:block;" alt="Page 10" draggable="false"></div>
    <div class="card-bg page"><img src="assets/samples/book2/chapter1-page11.jpg" loading="lazy" style="width:100%; display:block;" alt="Page 11" draggable="false"></div>
    <div class="card-bg page"><img src="assets/samples/book2/chapter1-page12.jpg" loading="lazy" style="width:100%; display:block;" alt="Page 12" draggable="false"></div>
    <div class="card-bg page"><img src="assets/samples/book2/chapter1-page13.jpg" loading="lazy" style="width:100%; display:block;" alt="Page 13" draggable="false"></div>
    <div class="card-bg page"><img src="assets/samples/book2/chapter1-page14.jpg" loading="lazy" style="width:100%; display:block;" alt="Page 14" draggable="false"></div>
    <div class="card-bg page"><img src="assets/samples/book2/chapter1-page15.jpg" loading="lazy" style="width:100%; display:block;" alt="Page 15" draggable="false"></div>
  </div>

  <div class="nav-controls" style="margin-top: 10px; z-index: 20; position: relative;">
    <button onclick="changePage(-1)" id="prevBtn">⬅️ Previous</button>
    <span id="pageCounter">Page 1 of 15</span>
    <button onclick="changePage(1)" id="nextBtn">Next ➡️</button>
  </div>
</div>
<script>
let currentPage = 0;
const pages = document.querySelectorAll('.page');
const pageCounter = document.getElementById('pageCounter');

// TTS state tracking
let synth = window.speechSynthesis;
let utterance = null;
let isPaused = false;
let voices = [];

// --- Obscured Story Text Array ---
// Replace these placeholder strings with your actual Base64-encoded chapter text for each page
const obscuredPages = [
"Use Base64 encoding to store the text content of each page here. For example, if you have the text for page 1, encode it using Base64 and place the resulting string in this array at index 0. Repeat this process for all pages, ensuring that the order of the text matches the order of the page images. This way, when a user clicks 'Play Audio,' the TTS engine can decode the corresponding text and read it aloud while displaying the correct page."
];

function showPage(index) {
  if (index < 0 || index >= pages.length) return;

  pages.forEach(page => page.classList.remove('active'));
  pages[index].classList.add('active');
  pageCounter.innerText = `Page ${index + 1} of ${pages.length}`;

  document.getElementById('prevBtn').disabled = (index === 0);
  document.getElementById('nextBtn').disabled = (index === pages.length - 1);

  if (synth && synth.speaking) {
    stopTTS();
  }

  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function changePage(step) {
  currentPage += step;
  showPage(currentPage);
}

// --- Text To Speech Engine Functions ---

function populateVoiceList() {
  if (!synth) return;
  voices = synth.getVoices();
  const voiceSelect = document.getElementById('voiceSelect');
  voiceSelect.innerHTML = '';
  
  voices.forEach((voice, i) => {
    const option = document.createElement('option');
    option.textContent = `${voice.name} (${voice.lang})`;
    option.value = i;
    if (voice.default) option.selected = true;
    voiceSelect.appendChild(option);
  });
}

if (synth && synth.onvoiceschanged !== undefined) {
  synth.onvoiceschanged = populateVoiceList;
}

function toggleTTS() {
  if (!synth) return;

  if (synth.speaking && !isPaused) {
    synth.pause();
    isPaused = true;
    document.getElementById('ttsPlayBtn').innerText = "⏸️ Resume";
    return;
  }
  
  if (isPaused) {
    synth.resume();
    isPaused = false;
    document.getElementById('ttsPlayBtn').innerText = "⏸️ Pause";
    return;
  }

  let textToRead = "No readable content found.";
  if (obscuredPages[currentPage]) {
    try {
      textToRead = atob(obscuredPages[currentPage]);
    } catch (e) {
      console.error("Error decoding page text.", e);
    }
  }

  utterance = new SpeechSynthesisUtterance(textToRead);
  const selectedVoiceIndex = document.getElementById('voiceSelect').value;
  if (voices[selectedVoiceIndex]) {
    utterance.voice = voices[selectedVoiceIndex];
  }

  // --- Auto-Advance Logic ---
  utterance.onend = function() {
    // Check if there is a next page available in the sequence
    if (currentPage < pages.length - 1) {
      currentPage++; // Move index forward
      showPage(currentPage); // Update visual display and reset scroll
      
      // Small visual pause (300ms) before the next page begins speaking
      setTimeout(() => {
        toggleTTS(); 
      }, 300);
    } else {
      // If it's the final page, terminate playback cleanly
      stopTTS();
    }
  };

  document.getElementById('ttsPlayBtn').innerText = "⏸️ Pause";
  document.getElementById('ttsStopBtn').disabled = false;
  
  synth.speak(utterance);
}

function stopTTS() {
  if (!synth) return;
  synth.cancel();
  isPaused = false;
  document.getElementById('ttsPlayBtn').innerText = "▶️ Play Audio";
  document.getElementById('ttsStopBtn').disabled = true;
}

function changeVoice() {
  if (synth.speaking) {
    stopTTS();
    toggleTTS();
  }
}

populateVoiceList();
showPage(0);
</script>
</body>
