<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <title>Book 2, Chapter 1 Sample</title>

<style>
  /* Prevents users from highlighting or selecting text/images */
  .unselectable {
    -webkit-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;
    user-select: none;
  }

  .reader-container {
    position: relative;
    display: inline-block;
    max-width: 800px;
    border: 1px solid #ccc;
  }

  /* The Invisible Shield */
  .shield {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 10;
    background: rgba(255,-255, 255, 0); /* Completely transparent */
  }
.page {
  display: none;
  opacity: 0;
  transition: opacity 0.5s ease-in-out;
}

.page.active {
  display: block;
  opacity: 1;
}

.nav-controls {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px;
  background: #f9f9f9;
  border-top: 1px solid #ccc;
}
  button {
  padding: 8px 15px;
  cursor: pointer;
  background-color: #333;
  color: white;
  border: none;
  border-radius: 4px;
}

button:disabled {
  background-color: #ccc;
  cursor: not-allowed;
}
</style>
<body>
<h1>Book 2, Chapter 1 Sample</h1>
<div class="reader-container unselectable" oncontextmenu="return false;">
  <div class="shield"></div>
  
  <div id="page-viewer">
